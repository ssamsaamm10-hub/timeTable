e around me.", "exp": "While this is my first formal role, I am highly organized, detail-oriented, and ready to put in the real effort needed to support my batchmates.", "h": "3–4 hours", "tm": "I plan ahead and prioritize tasks based on deadlines.", "fb": "Inform the team early and agree on a realistic solution.", "x": "I’d just like to know what the expected scope of communication and coordination between the major reps and the student union will be once we start because i did not joint to them", "nt": ""}, {"s": "2026-10-27 11:00", "n": "Mohamed Tamer Sayed", "e": "m.tamer2396@nu.edu.eg", "y": "Senior", "m": "Computer engineering", "ph": "01015778481", "pos": "Freshman Representative", "why": "I aspire to become a Major Representative to represent my colleagues effectively, communicate their concerns, and contribute to a more collaborative and supportive academic environment. I believe this role will allow me to take responsibility, support my fellow students, and work closely with faculty members to address challenges and improve the overall university experience.", "exp": "Yes, I have extensive experience in student activities and university events at Nile University. I am currently the Head of Media & Marketing at NUMC and was previously the Vice Head of Media & Marketing at RPM NU, in addition to being a member of the Microsoft Club Media & Marketing team. I have also regularly volunteered as an usher with the Seec office during its events, as well as with the university ambassadors during Orientation Days and the Graduation Ceremony. These experiences have strengthened my leadership, communication, teamwork, organizational, and problem-solving skills, while teaching me how to interact professionally with students, faculty, and guests and handle responsibilities effectively.", "h": "5–6 hours", "tm": "I plan ahead and prioritize tasks based on deadlines.", "fb": "Inform the team early and agree on a realistic solution.", "x": "Having attended the Freshmen Orientation 2026, I had a great experience and really enjoyed meeting the new students. It reminded me of how important guidance and support are at the beginning of university life. I would love to help the new batch navigate their university journey, share my experience, and make their transition smoother and more enjoyable. I believe that being a Major Representative would give me the opportunity to make a positive impact, support my colleagues, and help them make the most of their time at Nile University.", "nt": ""}, {"s": "2026-10-28 10:00", "n": "Mohamed Hosameldin", "e": "m.hosameldin2349@nu.edu.eg", "y": "Senior", "m": "CE", "ph": "01027090701", "pos": "Senior Representative", "why": "To gain more experience , connections in addition to enhancing my problem solving skills", "exp": "Yes , I am the HR head in the music club", "h": "5–6 hours", "tm": "I use a to-do list or calendar to stay organized.", "fb": "Inform the team early and agree on a realistic solution.", "x": "", "nt": ""}, {"s": "2026-10-29 08:30", "n": "Nada Gad", "e": "n.gad2675@nu.edu.eg", "y": "Freshman", "m": "Computer Engineering", "ph": "01202837444", "pos": "Freshman Representative", "why": "To help other people understand tha campus life and to maintain their balance in life by knowing all the opportunities they can attend and how to make use of every moment in the university", "exp": "I volunteered with active camp initiative as trip organizer also I volunteered as PR with skills area initiative for helping people to learn programming and all the related clurses", "h": "3–4 hours", "tm": "I use a to-do list or calendar to stay organized.", "fb": "Try to finish it without informing anyone unless necessary.", "x": "", "nt": ""}, {"s": "2026-10-27 10:00", "n": "Arwa Khalil", "e": "a.mohamed2621@nu.edu.eg", "y": "Freshman", "m": "architecture", "ph": "01111662805", "pos": "Freshman Representative", "why": "to help students", "exp": "no", "h": "5–6 hours", "tm": "I sometimes struggle to balance t or calendar to stay organized.", "fb": "Try to finish it without informing anyone unless necessary.", "x": "", "nt": ""}, {"s": "2026-10-28 07:30", "n": "Mohammad Hussein Mahmoud", "e": "m.hussein2554@nu.edu.eg", "y": "Sophomore", "m": "ECE / Computer Engineering", "ph": "01141240910", "pos": "Opportunities lead", "why": "I regularly spend time exploring various platforms—including LinkedIn—to seek out professional, academic, and developmental opportunities. Since I am constantly tracking and gathering these resources, whether for immediate application or future use, I would like to take on this role—specifically as \"Opportunities Lead\"—to share these prospects directly with my peers and ensure they benefit from them as well. My goal is to bridge the gap so that no student misses out on an opportunity simply because they were unaware of it, and to build a supportive community where we can grow and succeed", "exp": "Yes. On a daily basis, I track, verify, and compile academic, professional, and developmental opportunities from various platforms—including LinkedIn and various sources for summer internships, both within and outside of Egypt. Through this practice, I have developed a strong ability to identify high-value opportunities that are particularly relevant to engineering students, especially those in the fields of electronics and computer engineering. Furthermore, I am experienced in effectively organizing information and communicating with my", "h": "More than 6 hours", "tm": "I plan ahead and prioritize tasks based on deadlines.", "fb": "Try to finish it without informing anyone unless necessary.", "x": "I am genuinely passionate about creating a well-connected and informed student community. Finding and sharing high-quality opportunities is already a daily habit for me, and if selected, I am fully ready to dedicate the necessary time and effort to ensure every student in our batch has easy access to resources that can boost their academic and professional journey.", "nt": ""}, {"s": "2026-10-27 09:30", "n": "Shady Mohamed Maprouk", "e": "s.mabroukkhaled2691@nu.edu.eg", "y": "Freshman", "m": "Mechanical Engineering", "ph": "01098322791", "pos": "Freshman Representative", "why": "I'm interested in this position and like to improve my responsibility", "exp": "No", "h": "3–4 hours", "tm": "I sometimes struggle to balance multiple commitments.", "fb": "Inform the team early and agree on a realistic solution.", "x": "", "nt": ""}, {"s": "2026-10-25 01:30", "n": "Zeina Hassan Abdelrahman", "e": "zeinahassannu@gmail.com", "y": "Freshman", "m": "Architecture and urban design", "ph": "01090900990", "pos": "Freshman Representative", "why": "Because I want to learn how to help the new comers as the representatives helped us, learn how to solve a problem and communicate, and enchance the social and management skills", "exp": "No I don't have but It will be my Best opportunity to be part of it", "h": "5–6 hours", "tm": "I sometimes struggle to balance multiple commitments.", "fb": "Inform the team early and agree on a realistic solution.", "x": "", "nt": ""}, {"s": "2026-10-26 11:00", "n": "Noor Saied", "e": "n.saied2498@nu.edu.eg", "y": "Junior", "m": "Mechatronics", "ph": "01020301896", "pos": "Freshman Representative", "why": "To help students and add it to my cv", "exp": "No this is my first time", "h": "3–4 hours", "tm": "I use a to-do list or calendar to stay organized.", "fb": "Try to finish it without informing anyone unless necessary.", "x": "Thank you", "nt": ""}, {"s": "2026-10-29 06:30", "n": "Baraa Sherif Hegazy", "e": "b.sherif2549@nu.edu.eg", "y": "Sophomore", "m": "Industrial Engineering", "ph": "01096294888", "pos": "Sophomore Representative", "why": "I have always wanted to leave my footprint in the university and this feels like a great chance to do so, I’ve also been involved in a lot of discussions with doctors/faculty members regarding my colleagues concerns and it always felt great to finally get what they ironment where students feel safe asking for help and expressing their concerns.", "exp": "I have gained experience through my school's student council, where I helped organize events, communicate details, supervise booths and coordinate activities. I was also elected as a team leader by my classmates for several school and DECI projects and competitions, where I organized roles and contributed to the project development and presentations. These projects involved developing and improving product ideas in areas such as healthcare, education and the environment. They also gave me experience in market research, basic financial and design planning, preparing business proposals and operation plans. I also participated in school charity events such as plays and charity markets. These experiences helped me develop my communication, teamwork and leadership skills.", "h": "3–4 hours", "tm": "I plan ahead and prioritize tasks based on deadlines.", "fb": "Inform the team early and agree on a realistic solution.", "x": "I'm excited to become more involved in my department and am willing to put in the effort needed to contribute meaningfully, learn from new experiences and take initiative. I'd appreciate the opportunity to grow through this role while helping make a positive difference.", "nt": ""}];
const HP=96,DAYS=["SUN","MON","TUE","WED","THU","FRI","SAT"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function cairo(s){const o=+$("off").value||0,[a,b]=s.split(" "),[y,m,d]=a.split("-").map(Number),[h,mi]=b.split(":").map(Number);return new Date(Date.UTC(y,m-1,d,h+o,mi))}
const hm=d=>String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0");
function render(){const q=$("q").value.toLowerCase(),L=D.map((p,i)=>({p,i,d:cairo(p.s)}));
const keys=[...new Set(L.map(x=>x.d.toISOString().slice(0,10)))].sort();
const h0=Math.floor(Math.min(...L.map(x=>x.d.getUTCHours()+x.d.getUTCMinutes()/60)))-0,h1=Math.ceil(Math.max(...L.map(x=>x.d.getUTCHours()+x.d.getUTCMinutes()/60+.25)));
const H=(h1-h0)*HP;let s='<div class="hd" style="border:0"></div>'+keys.map(k=>{const d=new Date(k+"T00:00Z"),n=L.filter(x=>x.d.toISOString().slice(0,10)==k).length;return`<div class="hd"><div class="d">${DAYS[d.getUTCDay()]}</div><div class="n">${d.getUTCDate()}</div><div class="c">${MON[d.getUTCMonth()]} · ${n} interviews</div></div>`}).join("");
let t='<div class="tcol" style="height:'+H+'px">';for(let h=h0;h<=h1;h++)t+=`<div class="tl" style="top:${(h-h0)*HP}px">${String(h).padStart(2,"0")}:00</div>`;t+="</div>";s+=t;
s=s.replace(/<div class="tcol"[\s\S]*$/,"");
let cols="";keys.forEach(k=>{let c=`<div class="col" style="height:${H}px">`;for(let h=h0;h<h1;h++)c+=`<div class="hl" style="top:${(h-h0)*HP}px"></div><div class="hl h" style="top:${(h-h0)*HP+HP/2}px"></div>`;
L.filter(x=>x.d.toISOString().slice(0,10)==k&&x.p.n.toLowerCase().includes(q)).forEach(x=>{const top=(x.d.getUTCHours()+x.d.getUTCMinutes()/60-h0)*HP;c+=`<button class="ev" style="top:${top+1}px;height:${HP/4-2}px;line-height:${HP/4-2}px" onclick="show(${x.i})"><b>${hm(x.d)}</b>${esc(x.p.n)}</button>`});cols+=c+"</div>"});
$("cal").style.gridTemplateColumns=`56px repeat(${keys.length},1fr)`;$("cal").innerHTML=s+t+cols}

${S("Why do you want to become a Major Representative?",p.why)}${S("Previous experience",p.exp)}
